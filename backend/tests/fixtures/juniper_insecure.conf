system {
    host-name EDGE-FW-JUN-02;
    services {
        ssh {
            protocol-version v2;
            root-login deny;
        }
        telnet;
    }
    login {
        user admin {
            class super-user;
            authentication {
                encrypted-password "$6$Example"; ## SECRET-DATA
            }
        }
        retry-options {
            tries-before-disconnect 3;
        }
    }
    ntp {
        server 0.0.0.0;
    }
}
snmp {
    community public {
        authorization read-only;
    }
}
security {
    policies {
        from-zone trust to-zone untrust {
            policy allow-all {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
    }
}
