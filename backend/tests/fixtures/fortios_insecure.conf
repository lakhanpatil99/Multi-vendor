#config-version=FGT60F-7.2.4
config system global
    set hostname "PERIM-FGT-03"
    set admin-ssh-v1 enable
    set admintimeout 480
    set gui-certificate "Fortinet_Factory"
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set password ENC SH2ExampleEncrypted
    next
end
config system interface
    edit "wan1"
        set ip 198.51.100.4 255.255.255.0
        set allowaccess ping https ssh telnet http
    next
end
config system snmp community
    edit 1
        set name "public"
        set status enable
    next
end
config system ntp
    set ntpsync disable
end
config firewall policy
    edit 1
        set name "any-any-allow"
        set srcintf "wan1"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set service "ALL"
    next
end
